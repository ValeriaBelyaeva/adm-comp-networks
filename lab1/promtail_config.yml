server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push # куда слать логи

scrape_configs:
  - job_name: system
    static_configs:
      - targets:
          - localhost # логи читаются с локальной ФС контейнера promtail
        labels:
          job: nextcloud_logs # по этой метке ищем логи в Grafana
          __path__: /opt/nc_data/*.log
